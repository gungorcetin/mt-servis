<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>MT Servis</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="bmw.png" alt="BMW" class="marka-logo" />
      <div class="brand-text">
        <div class="brand-name">MT Servis</div>
        <div class="brand-sub">Oto Servis Kayıt</div>
      </div>
      <img src="mini-cooper.png" alt="Mini" class="marka-logo marka-mini" />
    </div>
    <div class="topbar-right">
      <span id="appVer" class="appver"></span>
      <div id="syncBadge" class="badge badge-local">Cihazda</div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button class="tab active" data-view="list">
      <span class="ic">📋</span><span>Kayıtlar</span>
    </button>
    <button class="tab" data-view="new">
      <span class="ic">➕</span><span>Yeni Kabul</span>
    </button>
  </nav>

  <script src="config.js"></script>
  <script src="catalog.js"></script>
  <script src="db.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
